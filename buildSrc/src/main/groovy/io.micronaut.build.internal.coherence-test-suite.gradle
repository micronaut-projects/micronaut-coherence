/*
 * Convention for the documentation test suites (test-suite, test-suite-groovy, test-suite-kotlin,
 * test-suite-python). The user guide `snippet::` macros resolve their sources in these projects,
 * so every example is compiled and tested in all four languages against an embedded, in-process
 * Coherence cluster member.
 */
plugins {
    id 'java'
    id 'io.micronaut.build.internal.coherence-base'
}

dependencies {
    testImplementation projects.micronautCoherence
    testImplementation projects.micronautCoherenceData
    testImplementation platform(libs.boms.coherence)
    testImplementation libs.managed.coherence
    testImplementation mn.micronaut.inject
    testImplementation mn.micronaut.context
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.http.client
    testImplementation mnReactor.micronaut.reactor
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation mnTest.micronaut.test.junit5
    testImplementation libs.bedrock.testing.support

    testRuntimeOnly mn.snakeyaml
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
}

configurations.all {
    resolutionStrategy.preferProjectModules()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // the embedded Coherence cluster member must not try to discover other members on the network
    systemProperty "java.net.preferIPv4Stack", "true"
    systemProperty "coherence.ttl", "0"
    systemProperty "coherence.wka", "127.0.0.1"
    systemProperty "coherence.localhost", "127.0.0.1"
    forkEvery 1
}
